[project]
name = "alivia-edge"
version = "0.1.0"
description = "Edge de voz de Alivia: WebSocket/Bluetooth <-> Vosk, Whisper, Qwen (Ollama), Piper, MQTT"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "websockets>=14",
  "pyserial",
  "paho-mqtt>=2",
  "onnxruntime",
  "httpx",
  "peewee",
  "vosk",
  "faster-whisper>=1.1",
  "piper-tts",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "amqtt"]

[project.scripts]
alivia-edge = "alivia_edge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
